name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # En Linux se prueban las dos puntas del rango de Python; en macOS basta
        # una, porque lo que cambia allí es el sistema, no el intérprete. Los
        # runners de macOS son escasos en el plan free y cada job de más retrasa
        # a los que compilan la app, que son los que de verdad hacen falta.
        include:
          # 3.10 es el mínimo real: yt-dlp dejó de publicar para 3.9.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-15-intel      # x86_64
            python: "3.12"
          - os: macos-15            # Apple Silicon
            python: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar Tk y ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y python3-tk ffmpeg xvfb
          else
            brew install ffmpeg
          fi

      - name: Instalar aacyoutube
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Revisar el entorno
        run: python -m aacyoutube --doctor

      - name: La ventana debe abrir y cerrarse sin errores
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tests/test_gui_smoke.py
          else
            python tests/test_gui_smoke.py
          fi

      - name: Pruebas del núcleo
        run: python tests/test_core.py
