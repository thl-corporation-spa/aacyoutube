name: Compilar app de macOS

# Genera un .dmg por arquitectura y lo publica en una Release.
# Al marcar una etiqueta (v2.0.0, v2.1.0…) se crea la Release automáticamente.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write             # necesario para crear la Release y subir los .dmg

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 es el último runner con procesador Intel.
          - runner: macos-13
            arch: x86_64
            label: macOS Intel (x86_64)
          # macos-14 en adelante son Apple Silicon (serie M).
          - runner: macos-14
            arch: arm64
            label: macOS Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # trae el Tk 8.6 de python.org, con buen aspecto en macOS

      - name: Instalar dependencias de compilación
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.6" yt-dlp

      - name: Comprobar que Tkinter funciona
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Construir .app y .dmg
        env:
          AACY_ARCH: ${{ matrix.arch }}
        run: ./packaging/macos/build.sh

      - name: Verificar la arquitectura del resultado
        run: |
          APP="dist/${{ matrix.arch }}/aacyoutube.app"
          file "$APP/Contents/MacOS/aacyoutube"
          file "$APP/Contents/Frameworks/ffmpeg" || file "$APP/Contents/Resources/ffmpeg"
          # El binario debe ser nativo de esta arquitectura, no de la otra.
          file "$APP/Contents/MacOS/aacyoutube" | grep -q "${{ matrix.arch }}"
          codesign --verify --deep --strict "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: aacyoutube-macos-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*.dmg
          if-no-files-found: error

  release:
    name: Publicar Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true

      - name: Crear la Release con los dos .dmg
        uses: softprops/action-gh-release@v2
        with:
          files: dmgs/*.dmg
          generate_release_notes: true
          body: |
            ## Instalar en macOS

            | Tu Mac | Descarga |
            |---|---|
            | Procesador **Intel** | `aacyoutube-*-macos-x86_64.dmg` |
            | Chip **M1 / M2 / M3 / M4** | `aacyoutube-*-macos-arm64.dmg` |

            ¿No sabes cuál? Menú  → «Acerca de este Mac».

            Abre el `.dmg`, arrastra la app a Applications y **la primera vez
            ábrela con clic derecho → Abrir** (la app no está firmada con una
            cuenta de desarrollador de Apple).

            Trae ffmpeg incluido: no hay que instalar nada más.

            ## Instalar en Linux

            ```bash
            git clone git@github.com:${{ github.repository }}.git
            cd aacyoutube && ./packaging/linux/instalar.sh
            ```
