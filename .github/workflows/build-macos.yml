name: Compilar app de macOS

# Genera un .dmg por arquitectura y lo sube a la Release de la etiqueta.
# Al marcar una etiqueta (v2.0.0, v2.1.0…) se publica automáticamente.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write             # necesario para crear la Release y subir los .dmg

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 es el último runner con procesador Intel.
          - runner: macos-13
            arch: x86_64
            label: macOS Intel (x86_64)
          # macos-14 en adelante son Apple Silicon (serie M).
          - runner: macos-14
            arch: arm64
            label: macOS Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # trae el Tk 8.6 de python.org, con buen aspecto en macOS

      - name: Instalar dependencias de compilación
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.6" yt-dlp

      - name: Comprobar que Tkinter funciona
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Construir .app y .dmg
        env:
          AACY_ARCH: ${{ matrix.arch }}
        run: ./packaging/macos/build.sh

      - name: Verificar la arquitectura del resultado
        run: |
          APP="dist/${{ matrix.arch }}/aacyoutube.app"
          file "$APP/Contents/MacOS/aacyoutube"
          file "$APP/Contents/Frameworks/ffmpeg" || file "$APP/Contents/Resources/ffmpeg"
          # El binario debe ser nativo de esta arquitectura, no de la otra.
          file "$APP/Contents/MacOS/aacyoutube" | grep -q "${{ matrix.arch }}"
          codesign --verify --deep --strict "$APP"
          ls -lh dist/${{ matrix.arch }}/*.dmg

      # Los .dmg van directos a la Release, no a los artefactos de Actions:
      # los artefactos consumen la cuota de almacenamiento de la cuenta y los
      # archivos de una Release no. Cada job sube el suyo; el primero que llega
      # crea la Release y el segundo se encuentra con que ya existe.
      - name: Publicar el .dmg en la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sed "s|@REPO@|$GITHUB_REPOSITORY|g" packaging/macos/notas-release.md > notas.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "aacyoutube $TAG" --verify-tag --notes-file notas.md
          gh release upload "$TAG" dist/${{ matrix.arch }}/*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber

      # En una ejecución manual no hay etiqueta a la que subir, así que el .dmg
      # queda como artefacto. Si la cuota está llena no es motivo para fallar.
      - name: Guardar el .dmg como artefacto
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aacyoutube-macos-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*.dmg
