name: Compilar app de macOS

# Genera un .dmg por arquitectura y lo sube a la Release de la etiqueta.
# Al marcar una etiqueta (v2.0.0, v2.1.0…) se publica automáticamente.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

env:
  # Versión exacta del instalador universal2 de python.org, para la cruzada.
  PYTHON_VERSION: "3.12.8"

permissions:
  contents: write             # necesario para crear la Release y subir los .dmg

# Si se reetiqueta mientras algo sigue compilando, que la tanda vieja se corte
# en vez de competir por los runners de macOS con la nueva.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Las dos compilan en un runner Apple Silicon.
          #
          # Los runners Intel no se asignan nunca en esta cuenta: ni macos-13,
          # que GitHub retiró, ni macos-15-intel, que existe pero se queda en
          # cola indefinidamente y sin error. Comprobado con el flujo
          # comprobar-runners.yml: macos-14 y macos-15 arrancan, -intel no.
          # Por eso el binario Intel sale por compilación cruzada.
          - runner: macos-15
            arch: x86_64
            cruzada: true
            label: macOS Intel (x86_64)
          - runner: macos-15
            arch: arm64
            cruzada: false
            label: macOS Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      # El Python de setup-python en un runner Apple Silicon es solo arm64, y de
      # ahí no se puede extraer una mitad Intel. El instalador oficial de
      # python.org sí es universal2, con su Tcl/Tk también universal2.
      - name: Instalar Python universal2 (compilación cruzada)
        if: matrix.cruzada
        run: |
          PKG="python-${PYTHON_VERSION}-macos11.pkg"
          curl -fsSLO "https://www.python.org/ftp/python/${PYTHON_VERSION}/${PKG}"
          sudo installer -pkg "$PKG" -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/3.12/bin/python3"
          "$PYBIN" -VV
          # Tiene que traer las dos mitades, o la extracción del Intel fallará.
          lipo -archs "/Library/Frameworks/Python.framework/Versions/3.12/Python"
          echo "PYTHON=$PYBIN" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: ${{ !matrix.cruzada }}
        with:
          python-version: "3.12"   # trae el Tk 8.6, con buen aspecto en macOS

      - name: Instalar dependencias de compilación
        run: |
          PY="${PYTHON:-python3}"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "pyinstaller>=6.6" yt-dlp

      - name: Comprobar que Tkinter funciona
        run: ${PYTHON:-python3} -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Construir .app y .dmg
        env:
          AACY_ARCH: ${{ matrix.arch }}
          # Solo en la cruzada: le dice a PyInstaller qué mitad extraer.
          AACY_TARGET_ARCH: ${{ matrix.cruzada && 'x86_64' || '' }}
        run: ./packaging/macos/build.sh

      - name: Verificar la arquitectura del resultado
        run: |
          APP="dist/${{ matrix.arch }}/aacyoutube.app"
          # Esto es lo que de verdad importa en la cruzada: que no se haya
          # colado un binario arm64 dentro del .dmg que dice ser de Intel.
          lipo -archs "$APP/Contents/MacOS/aacyoutube"
          lipo -archs "$APP/Contents/Frameworks/ffmpeg" || true
          lipo -archs "$APP/Contents/MacOS/aacyoutube" | grep -qw "${{ matrix.arch }}"
          codesign --verify --deep --strict "$APP"
          # Versión mínima de macOS que declara el binario de verdad, para que
          # lo que promete el Info.plist y la documentación sea cierto.
          otool -l "$APP/Contents/MacOS/aacyoutube" | grep -A4 LC_BUILD_VERSION | grep -E "minos|sdk" | head -2
          ls -lh dist/${{ matrix.arch }}/*.dmg

      - name: Publicar el .dmg en la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sed "s|@REPO@|$GITHUB_REPOSITORY|g" packaging/macos/notas-release.md > notas.md
          # Las dos arquitecturas compilan a la vez y pueden intentar crear la
          # Release al mismo tiempo: al que pierde la carrera le basta con
          # seguir, porque la subida es la que tiene que salir bien.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "aacyoutube $TAG" --verify-tag --notes-file notas.md \
            || echo "la Release ya existe, la creó el otro job"
          gh release upload "$TAG" dist/${{ matrix.arch }}/*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Guardar el .dmg como artefacto
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aacyoutube-macos-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/*.dmg
